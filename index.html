<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSAV Quiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 650px; width: 100%; }
    h1 { color: #667eea; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
    input:focus { outline: none; border-color: #667eea; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button:hover { transform: translateY(-2px); }
    .divider { text-align: center; margin: 20px 0; color: #999; }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 8px; }
    .room-code { background: #667eea; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: 700; margin: 20px 0; letter-spacing: 2px; }
    .participant-list { background: #f5f5f5; border-radius: 8px; padding: 20px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
    .participant-item { padding: 10px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .participant-item:last-child { border-bottom: none; }
    .question-section { margin-bottom: 30px; }
    .timer-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
    .timer { font-size: 24px; font-weight: 700; color: #667eea; }
    .timer.warning { color: #ff6b6b; animation: pulse 0.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .answered-count { font-size: 12px; color: #999; text-align: center; margin: 15px 0; }
    .question-text { font-size: 18px; font-weight: 600; color: #333; margin: 20px 0; line-height: 1.5; }
    .options { display: grid; gap: 12px; }
    .option { padding: 16px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 15px; display: flex; gap: 12px; transition: all 0.3s; }
    .option:hover { border-color: #667eea; background: #f9f7ff; }
    .option.selected { background: #667eea; color: white; border-color: #667eea; }
    .option-letter { display: flex; width: 32px; height: 32px; background: #f0f0f0; border-radius: 6px; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    .option.selected .option-letter { background: rgba(255,255,255,0.3); }
    .ranking-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .ranking-table th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
    .ranking-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
    .waiting { text-align: center; color: #999; font-size: 14px; margin: 20px 0; }
    .btn-secondary { background: #f0f0f0 !important; color: #667eea !important; }
  </style>
</head>
<body>

<div class="container" id="app"></div>

<script>
const QUESTIONS = [
  { q: "According to the Q2 survey result, how do respondents rate day-to-day shore ↔ vessel coordination overall?", options: ["Mostly effective (78%), with very effective as a minority (9%)", "Mostly ineffective, requiring urgent redesign", "Equally split between effective and ineffective", "Not measured in the survey"], correct: 0 },
  { q: "Per Q7, which category of decision is reported as most frequently delayed?", options: ["Technical decisions", "Client-related decisions", "Crewing decisions (65%)", "Safety-related decisions"], correct: 2 },
  { q: "What is the minimum shipboard lube oil stock level defined in work instruction PFS-SSAV-OFF-006?", options: ["7,000 litres / 45 days", "10,000 litres / 60 days", "5,000 litres / 30 days", "No minimum is defined"], correct: 0 },
  { q: "Under PFS-SSAV-OFF-006, what are the validation and processing timeframes?", options: ["Validated within 3 days; processed within 7 days", "Validated within 24 hours; processed within 3 days", "No fixed timeframe", "Validated within 7 days; processed within 3 days"], correct: 0 },
  { q: "What is the standard controlled lead time from PO placement to base warehouse arrival (Phase 1)?", options: ["Over 30 days", "20 to 25 days", "3 to 5 days", "13 to 15 days"], correct: 3 },
  { q: "Which step marks where Supply Chain's control ends?", options: ["Step 9", "Step 4", "Step 6 — Staging at Port Base", "Step 5"], correct: 2 },
  { q: "What must happen before Procurement proceeds with a lower-cost alternative?", options: ["Formal Technical Team clearance is required", "Nothing", "The Master must approve", "The Country Head must sign"], correct: 0 },
  { q: "In the halogen lamp case (PO 5670003152), what caused ambiguity?", options: ["Wrong quantity", "Text and picture described different products", "Supplier substituted", "No attachments"], correct: 1 },
  { q: "Who must submit Supplier Feedback Form (Appendix H)?", options: ["The supplier", "HSEQ Officer", "Superintendent, Master, Chief Engineer", "Procurement Manager"], correct: 2 },
  { q: "What feedback does Appendix H emphasize?", options: ["Feedback optional", "Only safety incidents", "Only negative feedback", "Both negative and positive feedback"], correct: 3 },
  { q: "Who is Accountable for Major Planned Maintenance?", options: ["Vessel SBM", "Technical Manager", "Country Head", "Chief Engineer"], correct: 1 },
  { q: "SLA for Major Maintenance specification and AFE?", options: ["No SLA", "30 days", "6 months", "12 months before docking"], correct: 3 },
  { q: "Priority A (urgent) targets how many days for PO?", options: ["29 days", "7 days", "14 days", "3 days"], correct: 1 },
  { q: "Which server for Priority A vs B/C/D?", options: ["No difference", "Priority A: Brazil only; B/C/D: Brazil OR Central", "Central only", "Priority A: Central only"], correct: 1 },
  { q: "What must be finalized before contracting (SCM Priority 3)?", options: ["HSE certificate", "Nothing", "Mobilization date", "Full scope, terms, logistics"], correct: 3 }
];

const LETTERS = ['A', 'B', 'C', 'D'];
let STATE = {
  phase: 'join',
  name: '',
  roomCode: '',
  userId: 'user_' + Math.random().toString(36).substr(2, 9),
  isHost: false,
  error: '',
  currentQuestion: 0,
  selectedAnswer: null,
  answered: false,
  startTime: null
};

function getRoom() {
  try {
    const data = localStorage.getItem('room_' + STATE.roomCode);
    return data ? JSON.parse(data) : null;
  } catch (e) {
    console.error('Error getting room:', e);
    return null;
  }
}

function saveRoom(room) {
  localStorage.setItem('room_' + STATE.roomCode, JSON.stringify(room));
}

function createRoom() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    STATE.error = 'Digite seu nome';
    render();
    return;
  }
  
  STATE.name = name;
  STATE.roomCode = 'SSAV' + Math.random().toString(36).substr(2, 8).toUpperCase();
  STATE.isHost = true;
  
  const room = {
    code: STATE.roomCode,
    active: false,
    currentQuestion: 0,
    startTime: 0,
    participants: {}
  };
  
  room.participants[STATE.userId] = {
    name: name,
    answered: false,
    correct: 0
  };
  
  saveRoom(room);
  STATE.phase = 'lobby';
  STATE.error = '';
  render();
}

function joinRoom() {
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.toUpperCase().trim();
  
  if (!name) {
    STATE.error = 'Digite seu nome';
    render();
    return;
  }
  
  if (!code) {
    STATE.error = 'Digite o código da sala';
    render();
    return;
  }
  
  const room = getRoom();
  if (!room) {
    STATE.error = 'Código inválido';
    render();
    return;
  }
  
  STATE.name = name;
  STATE.roomCode = code;
  STATE.isHost = false;
  room.participants[STATE.userId] = {
    name: name,
    answered: false,
    correct: 0
  };
  
  saveRoom(room);
  STATE.phase = 'lobby';
  STATE.error = '';
  render();
}

function startQuiz() {
  if (!STATE.isHost) return;
  
  const room = getRoom();
  room.active = true;
  room.currentQuestion = 0;
  room.startTime = Date.now();
  saveRoom(room);
  STATE.startTime = Date.now();
  STATE.phase = 'quiz';
  render();
}

function submitAnswer(index) {
  if (STATE.answered) return;
  
  STATE.selectedAnswer = index;
  STATE.answered = true;
  
  const room = getRoom();
  const question = QUESTIONS[room.currentQuestion];
  const isCorrect = index === question.correct ? 1 : 0;
  
  room.participants[STATE.userId].answered = true;
  room.participants[STATE.userId].correct += isCorrect;
  saveRoom(room);
  
  render();
  
  setTimeout(() => {
    nextQuestion();
  }, 2000);
}

function nextQuestion() {
  if (!STATE.isHost) return;
  
  const room = getRoom();
  
  if (room.currentQuestion < QUESTIONS.length - 1) {
    room.currentQuestion++;
    room.startTime = Date.now();
    
    Object.values(room.participants).forEach(p => {
      p.answered = false;
    });
    
    saveRoom(room);
    STATE.currentQuestion = room.currentQuestion;
    STATE.selectedAnswer = null;
    STATE.answered = false;
    STATE.startTime = Date.now();
  } else {
    room.active = false;
    saveRoom(room);
    STATE.phase = 'results';
  }
  
  render();
}

function resetSession() {
  if (!STATE.isHost) return;
  localStorage.removeItem('room_' + STATE.roomCode);
  STATE.phase = 'join';
  STATE.roomCode = '';
  STATE.name = '';
  STATE.selectedAnswer = null;
  STATE.answered = false;
  STATE.error = '';
  render();
}

function leaveRoom() {
  STATE.phase = 'join';
  STATE.roomCode = '';
  STATE.name = '';
  STATE.error = '';
  render();
}

function checkRoomStatus() {
  if (!STATE.roomCode) return;
  
  const room = getRoom();
  if (!room) return;
  
  STATE.currentQuestion = room.currentQuestion;
  
  if (room.active && STATE.phase === 'lobby') {
    STATE.phase = 'quiz';
    STATE.startTime = Date.now();
    STATE.selectedAnswer = null;
    STATE.answered = false;
  }
  
  if (!room.active && STATE.phase === 'quiz' && STATE.currentQuestion >= QUESTIONS.length) {
    STATE.phase = 'results';
  }
}

function render() {
  checkRoomStatus();
  
  const room = STATE.roomCode ? getRoom() : null;
  const app = document.getElementById('app');
  
  if (STATE.phase === 'join') {
    app.innerHTML = `
      <h1>🚢 SSAV Quiz</h1>
      <p style="text-align: center; color: #666; margin-bottom: 30px;">Technical & Procurement Knowledge Check</p>
      
      <div class="form-group">
        <label>Seu Nome</label>
        <input type="text" id="nameInput" placeholder="Digite seu nome completo">
      </div>
      
      <button onclick="createRoom()">Criar Sala</button>
      
      <div class="divider">OU</div>
      
      <div class="form-group">
        <label>Código da Sala</label>
        <input type="text" id="codeInput" placeholder="Ex: SSAV1234" maxlength="20">
      </div>
      
      ${STATE.error ? `<div class="error">${STATE.error}</div>` : ''}
      
      <button onclick="joinRoom()">Entrar na Sala</button>
    `;
  } else if (STATE.phase === 'lobby' && room) {
    const participantList = Object.values(room.participants).map(p => `<div class="participant-item">✓ ${p.name}</div>`).join('');
    
    app.innerHTML = `
      <h1>🎯 Sala</h1>
      <div class="room-code">${STATE.roomCode}</div>
      <p style="text-align: center; color: #666;">${Object.keys(room.participants).length} participante(s) conectado(s)</p>
      
      <div class="participant-list">
        ${participantList}
      </div>
      
      ${STATE.isHost ? `
        <button onclick="startQuiz()">Iniciar Quiz</button>
        <button class="btn-secondary" onclick="leaveRoom()">Fechar Sala</button>
      ` : `
        <div class="waiting">⏳ Aguardando o host iniciar o quiz...</div>
        <button class="btn-secondary" onclick="leaveRoom()">Sair da Sala</button>
      `}
    `;
  } else if (STATE.phase === 'quiz' && room) {
    const q = QUESTIONS[room.currentQuestion];
    const elapsed = Math.round((Date.now() - STATE.startTime) / 1000);
    const timeLeft = Math.max(0, 30 - elapsed);
    const answeredCount = Object.values(room.participants).filter(p => p.answered).length;
    const isWarning = timeLeft <= 10;
    
    if (timeLeft === 0 && !STATE.answered && STATE.isHost) {
      setTimeout(() => nextQuestion(), 100);
    }
    
    const optionsHtml = q.options.map((option, index) => `
      <div class="option ${STATE.selectedAnswer === index ? 'selected' : ''}" 
           onclick="submitAnswer(${index})"
           style="pointer-events: ${STATE.answered ? 'none' : 'auto'}; opacity: ${STATE.answered && STATE.selectedAnswer !== index ? '0.5' : '1'};">
        <span class="option-letter">${LETTERS[index]}</span>
        <span>${option}</span>
      </div>
    `).join('');
    
    app.innerHTML = `
      <div class="timer-section">
        <span>Questão ${room.currentQuestion + 1} de ${QUESTIONS.length}</span>
        <span class="timer ${isWarning ? 'warning' : ''}">${timeLeft}s</span>
      </div>
      
      <div class="answered-count">${answeredCount}/${Object.keys(room.participants).length} participantes responderam</div>
      
      <div class="question-text">${q.q}</div>
      
      <div class="options">
        ${optionsHtml}
      </div>
    `;
    
    setTimeout(() => render(), 100);
  } else if (STATE.phase === 'results' && room) {
    const results = Object.values(room.participants)
      .sort((a, b) => b.correct - a.correct)
      .map((p, index) => `
        <tr>
          <td style="font-weight: 700; color: #667eea;">${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1)}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.correct}/${QUESTIONS.length}</td>
        </tr>
      `).join('');
    
    app.innerHTML = `
      <h1 style="text-align: center;">🏆 Ranking Final</h1>
      
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Posição</th>
            <th>Nome</th>
            <th>Acertos</th>
          </tr>
        </thead>
        <tbody>
          ${results}
        </tbody>
      </table>
      
      ${STATE.isHost ? `
        <button onclick="resetSession()">Nova Seção</button>
      ` : `
        <button class="btn-secondary" onclick="leaveRoom()">Sair</button>
      `}
    `;
  }
  
  // Auto-update para outras abas
  setInterval(checkRoomStatus, 500);
}

// Listener para sincronização com outras abas
window.addEventListener('storage', () => {
  render();
});

// Render inicial
render();
</script>

</body>
</html>
